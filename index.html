<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Próximo seminario · Doctorado en Ciencias de la Computación UV</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <fieldset class="tarjeta">
      <legend class="etiqueta" id="etiqueta">Próximo seminario</legend>

      <p class="estado" id="cargando">cargando<span class="cursor" aria-hidden="true"></span></p>

      <div class="estado" id="vacio" hidden>
        <h1 class="titulo">Por anunciar</h1>
        <p class="texto-suave">Consulta más tarde la fecha del siguiente seminario.</p>
      </div>

      <div class="estado" id="error" hidden role="alert">
        <h1 class="titulo">No se pudo cargar la información</h1>
        <p class="texto-suave">Intenta recargar la página.</p>
      </div>

      <div id="evento" hidden>
        <h1 class="titulo" id="titulo"></h1>
        <p class="ponente" id="ponente"></p>

        <dl class="datos">
          <div>
            <dt>fecha</dt>
            <dd><time id="fecha"></time></dd>
          </div>
          <div id="detalle-lugar">
            <dt>lugar</dt>
            <dd id="lugar"></dd>
          </div>
        </dl>

        <p class="en-vivo" id="en-vivo" hidden>el seminario está comenzando<span class="cursor" aria-hidden="true"></span></p>

        <div class="cuenta" id="cuenta" aria-label="Tiempo restante">
          <span class="unidad"><span class="numero" id="dias">00</span><abbr title="días" id="label-dias">d</abbr></span>
          <span class="unidad"><span class="numero" id="horas">00</span><abbr title="horas">h</abbr></span>
          <span class="unidad"><span class="numero" id="minutos">00</span><abbr title="minutos">m</abbr></span>
          <span class="unidad"><span class="numero" id="segundos">00</span><abbr title="segundos">s</abbr></span>
        </div>
      </div>
    </fieldset>
  </main>
  <noscript>
    <p class="estado">Activa JavaScript para ver la cuenta regresiva.</p>
  </noscript>
</body>
</html>
